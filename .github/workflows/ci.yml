name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 验证 · Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node:
          - 22
          - 24
          - 26
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/setup@v3
        with:
          runtime: node@${{ matrix.node }}

      - name: 安装依赖
        run: pnpm ci

      - name: 代码风格（oxlint + oxfmt）
        run: pnpm lint:check

      - name: 类型检查
        run: pnpm typecheck

      # 这两个盲区不在 `pnpm typecheck` 里（见 tsconfig.scripts.json 与 packages/desktop/tsconfig.json 的注释）：
      # desktop 被根 typecheck 有意排除（避免日常验证拉 Electron），scripts/** 不被任何包的 tsconfig 覆盖。
      # 纯 tsc，不需要 Electron 二进制，ubuntu runner 直接跑。
      - name: 类型检查（desktop，checkJs）
        run: pnpm typecheck:desktop

      - name: 类型检查（scripts）
        run: pnpm typecheck:scripts

      - name: 构建
        run: pnpm build

      - name: 单元测试
        run: pnpm test

      - name: 端到端验收
        run: pnpm acceptance
